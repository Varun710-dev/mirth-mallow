<body data-page="shop">
<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <nav class="crumbs"><a href="index.html">Home</a> › <a href="#">Shop</a> › <b>Home Essentials</b></nav>
    <h1>Home Essentials

<div class="shop">
  <aside>
    <div class="panel">
      <div class="panel-head"><span style="display:flex;align-items:center"><a class="back" href="index.html" aria-label="Back"><svg viewBox="0 0 12 12"><path d="M8 2L4 6l4 4"/></svg></a>Categories</span><a href="index.html">Shop All</a></div>
      <div class="cat-list" id="catList"></div>

    <div class="panel filters">

      <details class="f" open>
        <summary>Price Range <svg viewBox="0 0 12 12"><path d="M2 4l4 4 4-4"/></svg></summary>
        <div class="range"><div class="bar"></div><div class="fill" id="fill"></div>
          <input type="range" id="minR" min="0" max="5000" step="50" value="0" aria-label="Minimum price">

        <div class="range-vals"><span id="minV">₹0</span><span id="maxV">₹5,000</span></div>

      <details class="f" open>
        <summary>Colour <svg viewBox="0 0 12 12"><path d="M2 4l4 4 4-4"/></svg></summary>
        <div class="swatches" id="swatches"></div>

      <details class="f" open>
        <summary>Material <svg viewBox="0 0 12 12"><path d="M2 4l4 4 4-4"/></svg></summary>
        <div class="checks" id="mats"></div>

    <div class="shop-head">

      <select class="sort" id="sort" aria-label="Sort products">

        <option value="high">Price: High to Low</option>
        <option value="az">Name: A to Z</option>
